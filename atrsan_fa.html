bels;

:root{
  --bg:#F2EDE4; --paper:#FAF7F1; --sunk:#E9E2D6;
  --ink:#241D19; --ink-2:#5E534B; --ink-3:#8C8076;
  --line:rgba(36,29,25,.13); --line-2:rgba(36,29,25,.26);
  --accent:#6B2C43; --accent-ink:#FAF7F1;
  --good:#3F6B4A; --warn:#9A6A1C; --bad:#9B3B32;
  --f-floral:#A8495E; --f-oriental:#A5602F; --f-green:#64774E; --f-aquatic:#2D5675;
  --f-woody:#A66A33; --f-gourmand:#8A5236; --f-leather:#5B4335; --f-musk:#8A7B70;
  --f-citrus:#B88B22; --f-amber:#A9572A; --f-fresh:#4E7C7A; --f-fruity:#B0574A; --f-mysterious:#5A3B62;
  --glass:rgba(255,255,255,.55); --glass-edge:rgba(36,29,25,.35);
  --display:"Bodoni Moda","Amiri", Georgia, serif;
  --sans:"Vazirmatn", Tahoma, Arial, sans-serif;
  --mono:"Vazirmatn", "IBM Plex Mono", ui-monospace, monospace;
  --gut:clamp(16px,4vw,56px);
  --radius:2px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17120F; --paper:#201A16; --sunk:#2A231E;
  --ink:#EFE6DA; --ink-2:#BCAE9F; --ink-3:#8F8377;
  --line:rgba(239,230,218,.12); --line-2:rgba(239,230,218,.26);
  --accent:#D8A0B3; --accent-ink:#1B1412;
  --good:#8FBF97; --warn:#E0B060; --bad:#E58C80;
  --f-floral:#D77E92; --f-oriental:#D88E57; --f-green:#9BB27F; --f-aquatic:#7FA9CB;
  --f-woody:#D69A5E; --f-gourmand:#C88A66; --f-leather:#A98670; --f-musk:#B9A99C;
  --f-citrus:#DDB54F; --f-amber:#DB8752; --f-fresh:#86B6B3; --f-fruity:#E08C7E; --f-mysterious:#A88BB3;
  --glass:rgba(255,255,255,.10); --glass-edge:rgba(239,230,218,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17120F; --paper:#201A16; --sunk:#2A231E;
  --ink:#EFE6DA; --ink-2:#BCAE9F; --ink-3:#8F8377;
  --line:rgba(239,230,218,.12); --line-2:rgba(239,230,218,.26);
  --accent:#D8A0B3; --accent-ink:#1B1412;
  --good:#8FBF97; --warn:#E0B060; --bad:#E58C80;
  --f-floral:#D77E92; --f-oriental:#D88E57; --f-green:#9BB27F; --f-aquatic:#7FA9CB;
  --f-woody:#D69A5E; --f-gourmand:#C88A66; --f-leather:#A98670; --f-musk:#B9A99C;
  --f-citrus:#DDB54F; --f-amber:#DB8752; --f-fresh:#86B6B3; --f-fruity:#E08C7E; --f-mysterious:#A88BB3;
  --glass:rgba(255,255,255,.10); --glass-edge:rgba(239,230,218,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:0}
p{margin:0}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{padding-inline:var(--gut);max-width:1440px;margin-inline:auto}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:0;color:var(--ink-3)}
.lab{font-family:var(--mono);font-size:12px;letter-spacing:0;color:var(--ink-2);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.it{font-style:normal}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;height:64px}
.mark{font-family:var(--display);font-size:22px;letter-spacing:0;font-weight:500;text-decoration:none;display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.mark small{font-family:var(--mono);font-size:9px;letter-spacing:0;color:var(--ink-3)}
.nav{display:flex;gap:22px;flex:1;justify-content:center}
.nav button{font-size:12px;letter-spacing:0;color:var(--ink-2);padding:6px 0;border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.nav button:hover,.nav button[aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.nav .atelier-link{color:var(--accent)}
.tools{display:flex;gap:6px;align-items:center}
.ico{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;position:relative;transition:background .2s}
.ico:hover{background:var(--sunk)}
.ico svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.4}
.badge{position:absolute;top:3px;left:2px;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-family:var(--mono);display:grid;place-items:center;padding:0 4px}
.badge:empty{display:none}
.whisper{border-bottom:1px solid var(--line);font-size:12px;letter-spacing:0;text-align:center;padding:7px var(--gut);color:var(--ink-2)}
.whisper button{text-decoration:underline;text-underline-offset:3px;color:var(--ink)}

/* mobile tab bar */
.tabbar{display:none}
@media (max-width:900px){
  .nav{display:none}
  .top .wrap{justify-content:space-between}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:45;background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;letter-spacing:0;color:var(--ink-3);padding:4px 0}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  .tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.4}
  body{padding-bottom:72px}
  .hide-m{display:none!important}
}

/* ---------- buttons, inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 26px;font-size:12px;letter-spacing:0;border:1px solid var(--ink);background:var(--ink);color:var(--bg);transition:transform .25s var(--ease),background .2s,color .2s;white-space:nowrap}
.btn:hover{background:transparent;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.accent:hover{background:transparent;color:var(--accent)}
.btn.sm{height:36px;padding:0 16px;font-size:11px}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{font-size:12px;letter-spacing:0;border-bottom:1px solid currentColor;padding-bottom:2px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:11px;letter-spacing:0;color:var(--ink-2)}
.input,select.input,textarea.input{height:46px;border:1px solid var(--line-2);background:var(--paper);padding:0 14px;border-radius:var(--radius);width:100%}
textarea.input{height:auto;min-height:96px;padding:12px 14px;resize:vertical;line-height:1.5}
.input:focus{outline:none;border-color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border:1px solid var(--line-2);border-radius:16px;font-size:13px;color:var(--ink-2);transition:all .2s var(--ease);background:transparent}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.neg[aria-pressed="true"]{background:transparent;color:var(--bad);border-color:var(--bad);text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:8px}
input[type=range]{width:100%;accent-color:var(--accent)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.25fr .75fr;gap:32px;align-items:end;padding-block:clamp(56px,9vw,120px) clamp(40px,6vw,80px);min-height:min(720px,86vh)}
.hero h1{font-size:clamp(52px,9vw,140px);line-height:1.2;letter-spacing:0;font-weight:400}
.hero h1 em{font-style:normal;font-weight:400;display:block;padding-inline-start:.9em;color:var(--accent)}
.hero .sub{max-width:34ch;font-size:18px;color:var(--ink-2);margin-top:28px}
.hero .ctas{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.hero .stage{position:relative;align-self:stretch;display:grid;place-items:center;min-height:360px}
.hero .stage{transition:transform .8s var(--ease)}
.hero .stage .art{width:min(100%,380px);animation:float 9s ease-in-out infinite;filter:drop-shadow(0 30px 40px rgba(36,29,25,.12))}
.hero .plate{position:absolute;bottom:0;left:0;text-align:start}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-16px) rotate(1deg)}}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr;min-height:0}.hero .stage{min-height:260px;order:-1}.hero .stage .art{width:200px}.hero .plate{display:none}}

/* ---------- section scaffolding ---------- */
.sec{padding-block:clamp(56px,8vw,112px)}
.sec + .sec{border-top:1px solid var(--line)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;margin-bottom:clamp(28px,4vw,48px)}
.sec-head h2{font-size:clamp(32px,4.6vw,64px);line-height:1.3}
.sec-head h2 em{font-style:normal}
.sec-head p{max-width:46ch;color:var(--ink-2);margin-top:14px}
@media (max-width:700px){.sec-head{grid-template-columns:1fr}}

/* ---------- discovery box ---------- */
.ask{background:var(--paper);border:1px solid var(--line);padding:clamp(20px,3vw,40px)}
.ask form{display:flex;gap:0;border-bottom:1px solid var(--ink);align-items:center}
.ask input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--display);font-size:clamp(22px,3vw,38px);padding:10px 0;font-style:normal}
.ask input:focus{outline:none}
.ask input::placeholder{color:var(--ink-3)}
.ask .go{width:52px;height:52px;display:grid;place-items:center}
.ask .go svg{width:26px;height:26px;stroke:var(--ink);stroke-width:1.2;fill:none}
.examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.examples button{font-size:13px;color:var(--ink-2);border-bottom:1px dotted var(--ink-3);padding:2px 0;margin-inline-end:14px}
.examples button:hover{color:var(--ink)}

/* ---------- product art & cards ---------- */
.art{display:block;width:100%;height:auto}
.wall{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(20px,3vw,40px) clamp(14px,2vw,28px)}
.card{grid-column:span 3;position:relative;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.wide{grid-column:span 6}
.card.tall .frame{aspect-ratio:3/4.2}
.card .frame{position:relative;aspect-ratio:4/5;background:var(--sunk);overflow:hidden;cursor:pointer;border:0;width:100%;display:block}
.card.wide .frame{aspect-ratio:8/5}
.card .frame .art{position:absolute;inset:0;width:100%;height:100%;transition:transform 1.2s var(--ease)}
.card:hover .frame .art{transform:scale(1.04) translateY(-6px)}
.card .veil{position:absolute;inset:auto 0 0 0;padding:14px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(to top,color-mix(in srgb,var(--paper) 96%,transparent),color-mix(in srgb,var(--paper) 0%,transparent));transform:translateY(100%);transition:transform .45s var(--ease)}
.card:hover .veil,.card:focus-within .veil{transform:none}
.card .veil .notes{font-family:var(--display);font-style:normal;font-size:15px}
.card .veil .acts{display:flex;gap:6px;flex-wrap:wrap}
.card .veil .acts button{font-size:10.5px;letter-spacing:0;border:1px solid var(--line-2);background:var(--paper);height:30px;padding:0 10px}
.card .veil .acts button:hover{border-color:var(--ink)}
.card .heart{position:absolute;top:10px;left:10px;z-index:2;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:color-mix(in srgb,var(--paper) 70%,transparent)}
.heart svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:1.4;transition:fill .3s,transform .4s var(--ease)}
.heart[aria-pressed="true"] svg{fill:var(--accent);stroke:var(--accent);animation:pulse .5s var(--ease)}
@keyframes pulse{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.label{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}
.label .brand{font-size:11px;letter-spacing:0;color:var(--ink-3)}
.label .name{font-family:var(--display);font-size:22px;line-height:1.1;grid-column:1;cursor:pointer;text-align:start}
.label .price{grid-row:1/3;grid-column:2;align-self:end;font-family:var(--mono);font-size:13px}
.label .meta{grid-column:1/-1;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--ink-2);margin-top:4px;flex-wrap:wrap}
.fam{display:inline-flex;align-items:center;gap:6px}
.fam::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--hue)}
.stars{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.minibars{display:flex;gap:3px;align-items:flex-end;height:14px}
.minibars i{width:4px;background:var(--hue);opacity:.75;display:block;border-radius:1px}
.match{font-family:var(--mono);font-size:12px;color:var(--hue);letter-spacing:0}
.why{font-size:13px;color:var(--ink-2);font-style:normal;font-family:var(--display);line-height:1.35}
@media (max-width:1100px){.card{grid-column:span 4}.card.wide{grid-column:span 8}}
@media (max-width:760px){.card{grid-column:span 6}.card.wide{grid-column:span 12}.label .name{font-size:19px}}

/* swipe row (mobile-first carousel) */
.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:thin}
.row > *{scroll-snap-align:start}
.row .card{grid-column:auto}
@media (max-width:760px){.row{grid-auto-columns:72%}}

/* ---------- family spectrum ---------- */
.spectrum{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);border-inline-start:1px solid var(--line)}
.spectrum button{position:relative;aspect-ratio:1/1.15;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);text-align:start;padding:18px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:color .4s}
.spectrum button::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 75%,var(--hue),transparent 62%);opacity:.0;transition:opacity .6s var(--ease)}
.spectrum button:hover::before{opacity:.42}
.spectrum b{font-family:var(--display);font-weight:400;font-size:clamp(22px,2.4vw,34px);position:relative}
.spectrum span{position:relative}
@media (max-width:760px){.spectrum{grid-template-columns:repeat(2,1fr)}}

/* ---------- editorial bands ---------- */
.band{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(20px,3vw,48px);align-items:center}
.band .l{grid-column:1/7}.band .r{grid-column:7/13}
.band h2{font-size:clamp(34px,5vw,74px);line-height:1.3}
.band h2 em{font-style:normal}
@media (max-width:900px){.band .l,.band .r{grid-column:1/-1}}
.atelier-band{background:var(--ink);color:var(--bg)}
.atelier-band .muted{color:color-mix(in srgb,var(--bg) 70%,var(--ink))}
.atelier-band .eyebrow{color:color-mix(in srgb,var(--bg) 60%,var(--ink))}
.atelier-band .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.atelier-band .btn:hover{background:transparent;color:var(--bg)}
.formula-card{border:1px solid color-mix(in srgb,var(--bg) 25%,transparent);padding:28px;font-family:var(--mono);font-size:13px;line-height:2}
.formula-card hr{border:0;border-top:1px dashed color-mix(in srgb,var(--bg) 30%,transparent);margin:10px 0}

.stories-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(20px,3vw,40px)}
.story{grid-column:span 4;display:flex;flex-direction:column;gap:12px;text-align:start;min-width:0}
.story.lead{grid-column:span 8;grid-row:span 2}
.story .ph{aspect-ratio:4/3;overflow:hidden;background:var(--sunk)}
.story.lead .ph{aspect-ratio:16/11}
.story .ph canvas,.story .ph svg{width:100%;height:100%;display:block;transition:transform 1.4s var(--ease)}
.story:hover .ph svg{transform:scale(1.04)}
.story h3{font-size:clamp(22px,2.2vw,30px);line-height:1.08}
.story.lead h3{font-size:clamp(28px,3.2vw,46px);line-height:1.35}
@media (max-width:900px){.story,.story.lead{grid-column:1/-1;grid-row:auto}}

/* ---------- discover page ---------- */
.disc{display:grid;grid-template-columns:300px minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.filters{position:sticky;top:96px;display:flex;flex-direction:column;gap:22px;max-height:calc(100vh - 120px);overflow:auto;padding-inline-end:8px}
.filters h4{font-family:var(--sans);font-size:11px;letter-spacing:0;color:var(--ink-2);margin-bottom:10px;font-weight:500}
.filters .chip{height:28px;font-size:12px;padding:0 11px}
.filter-toggle{display:none}
@media (max-width:900px){
  .disc{grid-template-columns:1fr}
  .filters{position:fixed;inset:auto 0 0 0;top:auto;max-height:78vh;background:var(--paper);z-index:60;padding:22px var(--gut) calc(90px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-2);transform:translateY(105%);transition:transform .4s var(--ease);box-shadow:0 -20px 60px rgba(0,0,0,.18)}
  .filters.open{transform:none}
  .filter-toggle{display:inline-flex}
}
.results-head{display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap;margin:28px 0}
.interpret{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)}
.interpret .tag{font-family:var(--mono);font-size:11px;padding:3px 8px;background:var(--sunk);color:var(--ink)}
.interpret .tag.neg{color:var(--bad);text-decoration:line-through}
.res{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:clamp(14px,2vw,28px);padding:22px 0;border-top:1px solid var(--line);align-items:center}
.res .frame{aspect-ratio:4/5;background:var(--sunk);overflow:hidden;cursor:pointer}
.res .frame .art{width:100%;height:100%}
.res h3{font-size:clamp(22px,2.4vw,30px);cursor:pointer}
.res .score{text-align:end}
.res .score b{font-family:var(--display);font-weight:400;font-size:clamp(34px,4vw,54px);color:var(--hue);line-height:1}
.res .score small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:0;color:var(--ink-3)}
@media (max-width:640px){.res{grid-template-columns:88px minmax(0,1fr)}.res .score{grid-column:2;text-align:start}.res .score b{font-size:30px}}
.nomatch{background:var(--paper);border:1px solid var(--line);padding:clamp(24px,4vw,48px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:center;margin-bottom:28px}
.nomatch h3{font-size:clamp(26px,3vw,40px);line-height:1.4}
@media (max-width:760px){.nomatch{grid-template-columns:1fr}}

/* ---------- quiz ---------- */
.quiz{min-height:70vh;display:grid;grid-template-rows:auto 1fr auto;gap:28px;padding-block:clamp(32px,5vw,64px)}
.qprog{display:flex;gap:6px}
.qprog i{flex:1;height:2px;background:var(--line-2);display:block;transition:background .5s}
.qprog i.on{background:var(--ink)}
.qtitle{font-size:clamp(30px,4.6vw,64px);line-height:1.35;max-width:18ch}
.qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:36px}
.qopt{position:relative;aspect-ratio:3/4;overflow:hidden;text-align:start;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line);background:var(--sunk);transition:transform .5s var(--ease),border-color .3s}
.qopt .wash{position:absolute;inset:0;background:var(--wash);opacity:.85;transition:opacity .5s,transform 1.2s var(--ease)}
.qopt:hover .wash{transform:scale(1.08);opacity:1}
.qopt b{position:relative;font-family:var(--display);font-weight:400;font-size:24px;line-height:1.05;color:#F7F1E8;text-shadow:0 1px 18px rgba(0,0,0,.25)}
.qopt span{position:relative;font-size:12px;color:rgba(247,241,232,.85);margin-top:6px}
.qopt:hover{transform:translateY(-4px)}
.qopt[aria-pressed="true"]{border-color:var(--ink);outline:2px solid var(--ink);outline-offset:3px}
@media (max-width:640px){.qopts{grid-template-columns:repeat(2,1fr)}.qopt{aspect-ratio:1/1.05}.qopt b{font-size:19px}}
.reveal{animation:reveal 1.4s var(--ease) both}
@keyframes reveal{from{opacity:.25;transform:translateY(24px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.persona{font-size:clamp(44px,7.4vw,112px);line-height:1.25;letter-spacing:0}
.persona em{font-style:normal;color:var(--hue)}

/* ---------- product page ---------- */
.pdp{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(28px,5vw,80px);padding-block:clamp(24px,4vw,56px)}
.pdp .gallery{position:sticky;top:90px;align-self:start;background:var(--sunk);aspect-ratio:4/5;overflow:hidden}
.pdp .gallery .art{width:100%;height:100%}
.pdp h1{font-size:clamp(40px,5.4vw,84px);line-height:1.15;margin:10px 0 6px}
.pdp .lede{font-family:var(--display);font-style:normal;font-size:21px;line-height:1.4;color:var(--ink-2);margin:18px 0 24px;max-width:38ch}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sizes button{min-width:86px;height:58px;border:1px solid var(--line-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;line-height:1.3}
.sizes button small{color:var(--ink-3);font-size:10px}
.sizes button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.sizes button[aria-pressed="true"] small{color:inherit;opacity:.7}
.buy{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}
.buy .btn{flex:1;min-width:180px}
.specs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--line)}
.specs div{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.specs div:nth-child(odd){padding-inline-end:16px}
.specs dt{font-size:10.5px;letter-spacing:0;color:var(--ink-3)}
.specs dd{margin:0;font-size:14px}
@media (max-width:900px){.pdp{grid-template-columns:1fr}.pdp .gallery{position:relative;top:0}}

/* note pyramid as layered strata */
.strata{display:flex;flex-direction:column;gap:2px}
.stratum{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:16px;align-items:center;padding:20px 22px;overflow:hidden;color:var(--ink)}
.stratum::before{content:"";position:absolute;inset:0;background:var(--hue);opacity:var(--o)}
.stratum > *{position:relative}
.stratum .tier{font-family:var(--mono);font-size:10.5px;letter-spacing:0;color:var(--ink-2)}
.stratum .ns{font-family:var(--display);font-size:clamp(20px,2.2vw,28px);line-height:1.2}
.stratum .ns button{text-decoration:none;border-bottom:1px solid transparent}
.stratum .ns button:hover{border-color:currentColor}
.stratum .ns i{font-style:normal;color:var(--ink-3);padding:0 .3em}
.stratum .t{font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap}
@media (max-width:560px){.stratum{grid-template-columns:1fr}.stratum .t{display:none}}

.profile{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:32px;align-items:center}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:92px minmax(0,1fr) 28px;gap:12px;align-items:center;font-size:12px;letter-spacing:0;color:var(--ink-2)}
.bar .track{height:22px;display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.bar .track i{display:block;background:var(--line);transition:background .6s var(--ease)}
.bar .track i.on{background:var(--hue)}
.bar b{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--ink)}
.radar text{font-family:var(--mono);font-size:9px;letter-spacing:0;fill:var(--ink-2);}
@media (max-width:640px){.profile{grid-template-columns:1fr}.radar{max-width:260px;margin:auto}}

.drydown{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.drydown div{padding:14px 12px 0 0;border-inline-end:1px solid var(--line);font-size:13px}
.drydown div:last-child{border-inline-end:0}
.drydown b{display:block;font-family:var(--mono);font-weight:400;font-size:11px;color:var(--ink-3)}
@media (max-width:560px){.drydown{grid-template-columns:repeat(2,1fr)}.drydown div{padding-bottom:12px}}

/* reviews */
.review{padding:22px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px}
.review .who{font-size:13px}
.review .q{font-family:var(--display);font-size:20px;line-height:1.35}
.review .sub{display:flex;gap:16px;font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:10px;flex-wrap:wrap}
.review .help{margin-top:12px;font-size:12px;color:var(--ink-2);display:flex;gap:10px;align-items:center}
.review .help button{border:1px solid var(--line-2);height:28px;padding:0 10px;font-size:12px}
@media (max-width:640px){.review{grid-template-columns:1fr;gap:8px}}
.rate{display:flex;gap:4px}
.rate button{font-size:20px;color:var(--ink-3);line-height:1}
.rate button[aria-pressed="true"]{color:var(--accent)}

/* ---------- compare ---------- */
.cmp{overflow-x:auto}
.cmp table{border-collapse:collapse;width:100%;min-width:640px}
.cmp th,.cmp td{text-align:start;padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
.cmp th{font-size:10.5px;letter-spacing:0;color:var(--ink-3);font-weight:500;width:140px}
.cmp td.best{background:color-mix(in srgb,var(--hue) 14%,transparent)}

    "ادویه ای":"spicy","ادویه":"spicy","تند و ادویه ای":"spicy","spicy":"spicy","دودی":"smoky","دود":"smoky","smoky":"smoky",
    "چوبی":"woody","چوب":"woody","woody":"woody","گلی":"floral","گل":"floral","گلدار":"floral","floral":"floral","میوه ای":"fruity","میوه":"fruity","fruity":"fruity",
    "سبز":"green","green":"green","گیاهی":"herbal","herbal":"herbal","دریایی":"aquatic","آبی":"aquatic","aquatic":"aquatic","دریا":"sea","sea":"sea","ocean":"sea",
    "مرکباتی":"citrus","مرکبات":"citrus","citrus":"citrus","گورمند":"gourmand","خوراکی":"gourmand","gourmand":"gourmand","دسری":"dessert","dessert":"dessert",
    "ماسکی":"musky","musky":"musky","پودری":"powdery","powdery":"powdery","خامه ای":"creamy","کرمی":"creamy","creamy":"creamy","رزینی":"resinous","resinous":"resinous",
    "شرقی":"oriental","oriental":"oriental","چرمی":"leathery","leathery":"leathery","خاکی":"earthy","earthy":"earthy",
  };
  const PRE_NEG = new Set(["نه","بدون","بی","غیر","not","no","without","avoid","except","never"]);
  const POST_NEG = new Set(["نباشه","نباشد","نمیخوام","نمیخواهم","نخواهم","نمی","نه"]);
  const STOP = new Set(("خوام خواهم اصلا اصلاً حتما یه یک چیزی چیز عطری عطر بو بوی رایحه میخوام میخواهم میخوام خواهم دوست دارم دارد داره برای واسه با و ولی اما که مثل شبیه به رو را از در هم باشه باشد هست است من برام مناسب خیلی کمی یکم زیاد کم این اون آن یا تا ای اینکه چون یکی بیشتر "+
    "i want a an the something perfume fragrance scent for me and with but that is it of to like love looking need smell really very too more in on at be my similar or one").split(" "));
  const TAG_FA={mature:"پختگی",childish:"شیرینی بازیگوشانه",luxury:"حسی لوکس",niche:"چیزی خاص‌تر",bestseller:"محبوب‌ها"};

  // نرمال‌سازی: حروف عربی → فارسی، اعداد → لاتین، نیم‌فاصله → فاصله، حذف اعراب
  function norm(s){
    return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
      .replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/ة/g,"ه").replace(/[ً-ٰٟ]/g,"")
      .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
      .replace(/‌/g," ").replace(/&/g," and ").replace(/[^a-z0-9؀-ۿ\s'-]/g," ").replace(/[-،؛؟]/g," ").replace(/\s+/g," ").trim();
  }
  const byId=id=>PRODUCTS.find(p=>p.id===id);

  // عبارت‌های چندکلمه‌ای: نت‌ها، مراجع، محصولات، برندها
  let PHRASES=null, VOCAB=null;
  function build(){
    const ph=new Map(), v=new Map();
    const add=(k,info)=>{ const n=norm(k); if(!n) return; (n.includes(" ")?ph:v).set(n,info); };
    Object.entries(NOTES).forEach(([k,n])=>{ add(k,{kind:"note",key:k}); add(n.n,{kind:"note",key:k}); (n.aka||[]).forEach(a=>add(a,{kind:"note",key:k})); });
    Object.entries(REFERENCES).forEach(([k,r])=>{ add(k,{kind:"ref",key:k}); (r.aka||[]).forEach(a=>add(a,{kind:"ref",key:k})); });
    PRODUCTS.forEach(p=>{ const k=norm(p.name); ph.set(k,{kind:"product",key:p.id}); if(k.startsWith("the ")) ph.set(k.slice(4),{kind:"product",key:p.id}); });
    Object.entries(BRANDS).forEach(([k,b])=>{ ph.set(norm(b.n),{kind:"brand",key:k}); });
    ph.set(norm("عطرسان"),{kind:"brand",key:"atrsan"});
    Object.entries(FA).forEach(([w,k])=>add(w,{kind:"lex",key:k,word:w}));
    Object.entries(FAMILIES).forEach(([k,f])=>{ add(f.name,{kind:"fam",key:k}); add(k,{kind:"fam",key:k}); });
    Object.entries(MOOD_FA).forEach(([k,f])=>{ if(!v.has(norm(f))) add(f,{kind:"mood",key:k}); });
    Object.entries(OCC_FA).forEach(([k,f])=>{ if(!v.has(norm(f))&&!ph.has(norm(f))) add(f,{kind:"occ",key:k}); });
    Object.entries(SEASON_FA).forEach(([k,f])=>add(f,{kind:"season",key:k}));
    PHRASES=[...ph.entries()].sort((a,b)=>b[0].length-a[0].length); VOCAB=v;
  }
  function lev(a,b){
    const d=[...Array(a.length+1)].map(()=>Array(b.length+1).fill(0));
    for(let i=0;i<=a.length;i++)d[i][0]=i; for(let j=0;j<=b.length;j++)d[0][j]=j;
    for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){const c=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);}
    return d[a.length][b.length];
  }
  // پسوندهای رایج فارسی و جمع انگلیسی
  const SUFFIXES=["های","ها","ای","ی","s"];
  function resolveWord(w){
    if(VOCAB.has(w)) return {...VOCAB.get(w),word:w};
    for(const s of SUFFIXES){ if(w.length>s.length+1&&w.endsWith(s)&&VOCAB.has(w.slice(0,-s.length))) return {...VOCAB.get(w.slice(0,-s.length)),word:w.slice(0,-s.length)}; }
    if(w.length<4) return null;
    let best=null,bd=9;
    for(const k of VOCAB.keys()){ if(k[0]!==w[0]||Math.abs(k.length-w.length)>2) continue; const d=lev(w,k); if(d<bd){bd=d;best=k;} }
    const max=w.length>=8?2:1;
    return best&&bd<=max?{...VOCAB.get(best),word:best,corrected:w}:null;
  }

  /* تبدیل جمله‌ی طبیعی به ویژگی‌های وزن‌دار */
  function parse(q){
    if(!PHRASES) build();
    const out={features:[],avoid:[],similar:null,named:null,brand:null,interp:[],corrections:[],notesWanted:[]};
    let s=" "+norm(q)+" ";
    const found=[];
    for(const [k,info] of PHRASES){
      const re=new RegExp(`(^|\\s)${k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}(?=\\s|$)`);
      const m=s.match(re); if(!m) continue;
      const before=s.slice(0,m.index+m[1].length).trim();
      found.push({...info,phrase:k,simCtx:/(similar to|like|alternative to|dupe of|شبیه|شبیه به|مثل|مشابه|جایگزین)$/.test(before)});
      s=s.replace(re,` __${found.length-1}__ `);
    }
    const toks=s.trim().split(" ").filter(Boolean);
    const items=[]; let neg=0;
    toks.forEach(t=>{
      if(POST_NEG.has(t)&&t!=="نه"&&items.length){ items[items.length-1].neg=true; return; }
      if(PRE_NEG.has(t)){ neg=3; return; }
      if((t==="خیلی"||t==="too"||t==="زیاد")&&neg) return;
      if((t==="یا"||t==="or"||t==="و"||t==="and")&&items.length&&items[items.length-1].neg&&items[items.length-1].pre){ neg=2; return; }
      let item=null; const ph=t.match(/^__(\d+)__$/);
      if(ph) item=found[+ph[1]];
      else if(!STOP.has(t)){ item=resolveWord(t); if(item?.corrected) out.corrections.push([item.corrected,item.word]); }
      const isNeg=neg>0; if(neg>0) neg--;
      if(!item) return;
      items.push({item,neg:isNeg,pre:isNeg}); if(isNeg) neg=0;
    });
    items.forEach(({item,neg})=>apply(item,neg,out));
    return out;
  }
  function apply(item,isNeg,out){
    const sign=isNeg?-1:1;
    switch(item.kind){
      case "note": if(isNeg){out.avoid.push(item.key);out.interp.push({t:NOTES[item.key].n,neg:true});} else {out.features.push(F("note",item.key,1.4));out.notesWanted.push(item.key);out.interp.push({t:NOTES[item.key].n});} break;
      case "fam": out.features.push(F("fam",item.key,1.1,sign)); out.interp.push({t:FAMILIES[item.key].name,neg:isNeg}); break;
      case "mood": out.features.push(F("mood",item.key,1.1,sign)); out.interp.push({t:MOOD_FA[item.key],neg:isNeg}); break;
      case "occ": out.features.push(F("occ",item.key,1.1,sign)); out.interp.push({t:OCC_FA[item.key],neg:isNeg}); break;
      case "season": out.features.push(F("season",item.key,1,sign)); out.interp.push({t:SEASON_FA[item.key],neg:isNeg}); break;
      case "lex": (LEX[item.key]||[]).forEach(f=>{ if(isNeg&&f.type==="prof") out.features.push({...f,sign:-f.sign,w:f.w*.9}); else if(isNeg&&f.type==="note"){} else out.features.push({...f,sign:f.sign*sign}); }); out.interp.push({t:item.word||item.key,neg:isNeg}); break;
      case "product": if(item.simCtx){out.similar={kind:"product",id:item.key};out.interp.push({t:"شبیه "+byId(item.key).name});} else {out.named=item.key;out.similar={kind:"product",id:item.key};out.interp.push({t:byId(item.key).name});} break;
      case "ref": out.similar={kind:"ref",key:item.key}; out.interp.push({t:"شبیه "+REFERENCES[item.key].label}); REFERENCES[item.key].notes.forEach(n=>out.features.push(F("note",n,.7))); out.features.push(F("fam",REFERENCES[item.key].family,.6)); break;
      case "brand": out.brand=item.key; out.interp.push({t:BRANDS[item.key].n}); break;
    }
  }

  /* ---------- بردارها و شباهت ---------- */
  const noteKeys=Object.keys(NOTES), famKeys=Object.keys(FAMILIES), vecCache=new Map();
  function vec(p){
    if(vecCache.has(p.id)) return vecCache.get(p.id);
    const v=[]; noteKeys.forEach(n=>v.push(p.base.includes(n)?1.2:p.heart.includes(n)?1:p.top.includes(n)?.7:0));
    famKeys.forEach(f=>v.push(p.family===f?2:0)); p.profile.forEach(x=>v.push(x/10*1.5)); MOODS.forEach(m=>v.push(p.moods.includes(m)?.5:0));
    vecCache.set(p.id,v); return v;
  }
  const vecFromNotes=(notes,fam)=>[...noteKeys.map(n=>notes.includes(n)?1:0),...famKeys.map(f=>f===fam?2:0),...Array(6+MOODS.length).fill(0)];
  const cos=(a,b)=>{let d=0,na=0,nb=0;for(let i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}return na&&nb?d/Math.sqrt(na*nb):0;};
  function similar(p,n=4){ return PRODUCTS.filter(x=>x.id!==p.id&&x.published).map(x=>({p:x,s:cos(vec(p),vec(x))})).sort((a,b)=>b.s-a.s).slice(0,n); }

  /* ---------- امتیازدهی ---------- */
  function featureMatch(p,f){
    switch(f.type){
      case "note": return p.notes.includes(f.key)?1:(NOTES[f.key]&&p.family===NOTES[f.key].fam?.35:0);
      case "fam": { if(p.family===f.key) return 1; const c=p.notes.filter(n=>NOTES[n].fam===f.key).length; return Math.min(.6,c*.22); }
      case "mood": return p.moods.includes(f.key)?1:0;
      case "occ": return p.occ.includes(f.key)?1:0;
      case "season": return p.seasons.includes(f.key)?1:0;
      case "prof": return p.profile[f.key]/10;
      case "gender": return p.gender===f.key?1:p.gender==="U"?.75:0;
      case "tag": return f.key==="childish"?(p.profile[1]>=9||p.family==="fruity"?1:p.profile[1]>=7?.4:0):f.key==="mature"?(p.profile[1]<=7&&p.family!=="fruity"?1:.2):p.tags.includes(f.key)?1:0;
    }
    return 0;
  }
  function describe(f){
    switch(f.type){
      case "note": return NOTES[f.key].n;
      case "fam": return "رایحه‌های "+FAMILIES[f.key].name;
      case "mood": return f.sign>0?"حال‌وهوای "+MOOD_FA[f.key]:"چیزی نه چندان "+MOOD_FA[f.key];
      case "occ": return "استفاده در "+OCC_FA[f.key];
      case "season": return "فصل "+SEASON_FA[f.key];
      case "prof": return (f.sign>0?["حس تازگی","شیرینی","گرما","شدت بالا","ماندگاری طولانی","پخش بوی چشمگیر"]:["چیزی نه چندان تازه","شیرینی کنترل‌شده","حسی خنک‌تر","شدت ملایم","ماندگاری سبک‌تر","ردی نزدیک و آرام"])[f.key];
      case "gender": return {F:"گرایش زنانه",M:"گرایش مردانه",U:"عطری برای همه"}[f.key];
      case "tag": return TAG_FA[f.key]||f.key;
    }
    return "";
  }
  function search(query="",filters={}){
    const parsed=parse(query||"");
    const feats=[...parsed.features];
    (filters.fam||[]).forEach(k=>feats.push(F("fam",k,1.2)));
    (filters.mood||[]).forEach(k=>feats.push(F("mood",k,1.1)));
    (filters.occ||[]).forEach(k=>feats.push(F("occ",k,1.1)));
    (filters.season||[]).forEach(k=>feats.push(F("season",k,1)));
    (filters.notes||[]).forEach(k=>{feats.push(F("note",k,1.4));parsed.notesWanted.push(k);});
    if(filters.intensity!=null) feats.push(F("prof",3,1,filters.intensity>=5?1:-1));
    if(filters.longevity!=null&&filters.longevity>=6) feats.push(F("prof",4,1));
    const avoid=[...parsed.avoid,...(filters.avoid||[])], brand=filters.brand||parsed.brand;
    let simVec=null;
    if(parsed.similar?.kind==="product") simVec=vec(byId(parsed.similar.id));
    if(parsed.similar?.kind==="ref") simVec=vecFromNotes(REFERENCES[parsed.similar.key].notes,REFERENCES[parsed.similar.key].family);
    const hasIntent=feats.length||simVec||brand;
    const pool=PRODUCTS.filter(p=>p.published).filter(p=>!avoid.some(a=>p.notes.includes(a))).filter(p=>!brand||p.brand===brand)
      .filter(p=>!(parsed.similar?.kind==="product"&&!parsed.named&&p.id===parsed.similar.id))
      .filter(p=>!filters.gender||filters.gender==="any"||p.gender===filters.gender||p.gender==="U")
      .filter(p=>!filters.priceMax||p.variants[1].price<=filters.priceMax);
    const results=pool.map(p=>{
      let num=0,den=0; const hits=[];
      feats.forEach(f=>{ let m=featureMatch(p,f); if(f.sign<0) m=1-m; num+=f.w*m; den+=f.w;
        if(m>=.7&&f.sign>0) hits.push({f,w:f.w*m}); else if(m>=.75&&f.sign<0&&f.type==="prof") hits.push({f,w:f.w*m*.6}); });
      if(simVec){ const s=cos(vec(p),simVec); num+=2.4*s; den+=2.4; if(s>.55) hits.unshift({f:{type:"sim"},w:3}); }
      if(parsed.named===p.id){ num+=4; den+=4; }
      const quality=Math.min(1,Math.max(0,p.rating-4))*.6+Math.min(1,p.sold/3000)*.4;
      const score=den?.9*(num/den)+.1*quality:.5+.3*quality;
      if(brand&&p.brand===brand) hits.push({f:{type:"brand"},w:.5});
      hits.sort((a,b)=>b.w-a.w);
      const seen=new Set(), reasons=[];
      hits.forEach(h=>{ let d;
        if(h.f.type==="sim") d=parsed.similar.kind==="product"?"ساختاری شبیه "+byId(parsed.similar.id).name:"ساختار نتی مشابه";
        else if(h.f.type==="brand") d="سبک "+BRANDS[p.brand].n;
        else { if(h.f.type==="fam"&&hits.some(x=>x.f.type==="note"&&x.f.key===h.f.key)) return; d=describe(h.f); }
        if(d&&!seen.has(d)){seen.add(d);reasons.push(d);} });
      const why=parsed.named===p.id?p.lede:reasons.length?(hits[0]?.f.type==="sim"?"دارای "+faList(reasons.slice(0,3))+".":"هماهنگ با علاقه‌ی شما به "+faList(reasons.slice(0,3))+"."):hasIntent?"همخوانی نسبی: بخشی از شخصیتی که توصیف کردید را دارد.":p.lede;
      return {p,score,pct:Math.max(42,Math.min(98,Math.round(36+62*score))),why,hasAll:parsed.notesWanted.every(n=>p.notes.includes(n))};
    }).sort((a,b)=>b.score-a.score||b.p.rating-a.p.rating);
    const top=results[0], wanted=[...new Set(parsed.notesWanted)];
    const exact=results.filter(r=>r.hasAll&&(r.score>=.55||!feats.length));
    let noExact=!results.length||(hasIntent&&(!exact.length||top.score<.5));
    if(wanted.length>=2&&!results.some(r=>r.hasAll)) noExact=true;
    return {results,parsed,noExact,wanted,avoid};
  }

  /* ---------- پیشنهاد شخصی ---------- */
  function recommend(ctx,n=6){
    const base=PRODUCTS.map(()=>0), why=PRODUCTS.map(()=>({w:0,t:""}));
    const owned=new Set(ctx.purchased||[]);
    const bump=(i,w,t)=>{base[i]+=w; if(w>why[i].w) why[i]={w,t};};
    const month=new Date().getMonth(); const season=month<2||month===11?"winter":month<5?"spring":month<8?"summer":"autumn";
    PRODUCTS.forEach((p,i)=>{
      [...(ctx.wishlist||[]),...(ctx.purchased||[])].forEach(id=>{ const q=byId(id); if(!q||q.id===p.id) return; const s=cos(vec(p),vec(q)); if(s>.45) bump(i,s*1.6,"شبیه عطر محبوب شما، "+q.name); });
      (ctx.favNotes||[]).forEach(nt=>{ if(p.notes.includes(nt)) bump(i,.55,"چون "+NOTES[nt].n+" را دوست دارید"); });
      (ctx.favBrands||[]).forEach(b=>{ if(p.brand===b) bump(i,.35,"از "+BRANDS[b].n+"، خانه‌ای که به آن برمی‌گردید"); });
      (ctx.quiz?.features||[]).forEach(f=>{ if(featureMatch(p,f)>.7) bump(i,.4*f.w,"مناسب شخصیت رایحه‌ای شما"); });
      if(p.seasons.includes(season)) bump(i,.25,"مناسب "+SEASON_FA[season]+" امسال");
      base[i]+=p.sold/30000+(p.rating-4)*.2;
    });
    return PRODUCTS.map((p,i)=>({p,s:base[i],why:why[i].t||"محبوب این ماه"})).filter(r=>!owned.has(r.p.id)&&r.p.published).sort((a,b)=>b.s-a.s).slice(0,n);
  }
  return {search,parse,similar,recommend,byId,list:faList,featureMatch,F,norm};
})();

function discResults(){
  const d=S.disc;
  const r=Engine.search(d.q,{fam:d.fam,mood:d.mood,occ:d.occ,season:d.season,gender:d.gender,priceMax:d.priceMax,intensity:d.intensity,longevity:d.longevity,avoid:d.avoid,brand:d.brand});
  const interp=[...r.parsed.interp.map(i=>`<span class="tag ${i.neg?"neg":""}">${esc(i.t)}</span>`),...d.avoid.map(a=>`<span class="tag neg">${NOTES[a].n}</span>`)];
  const corr=r.parsed.corrections.map(([a,b])=>`<span>نتایج برای «<b>${esc(b)}</b>» به جای «${esc(a)}».</span>`).join(" ");
  const active=d.q||d.fam.length||d.mood.length||d.occ.length||d.season.length||d.avoid.length||d.brand||d.intensity!=null||d.longevity!=null||d.gender!=="any";
  let html=`<div class="results-head"><div class="interpret">${interp.length?`<span>برداشت ما:</span>${interp.join("")}`:`<span>${faNum(PRODUCTS.length)} عطر، به ترتیب پیشنهاد ما.</span>`}</div><button class="btn ghost sm filter-toggle" onclick="document.getElementById('filters').classList.add('open')">فیلترها</button></div>`;
  if(corr) html+=`<p class="muted" style="margin:-14px 0 18px;font-size:13px">${corr}</p>`;
  if(!r.results.length){ html+=noMatchBlock(d.q,r)+`<div class="empty"><p>یکی از فیلترها یا نت‌های حذف‌شده را بردارید.</p></div>`; return html; }
  if(active && r.noExact){ html+=noMatchBlock(d.q,r); html+=`<p class="eyebrow" style="margin-bottom:6px">این رایحه‌های نزدیک را امتحان کنید</p>`; }
  const rows=r.results.slice(0,active?8:12);
  html+=rows.map(x=>{const p=x.p;return `<article class="res" style="--hue:${hueOf(p)}">
    <div class="frame" role="link" tabindex="0" aria-label="مشاهده‌ی ${esc(p.name)}" onclick="go('p-${p.id}')" onkeydown="if(event.key==='Enter')go('p-${p.id}')">${Art.bottle(p,{name:false})}</div>
    <div style="min-width:0"><p class="eyebrow">${bname(p.brand)} · ${FAMILIES[p.family].name} · ${money(p.variants[1].price)}</p><h3 onclick="go('p-${p.id}')">${pname(p)}</h3>
      <p class="why" style="margin-top:6px">${esc(active?x.why:p.lede)}</p>
      <p class="lab" style="margin-top:8px">${p.notes.slice(0,5).map(n=>NOTES[n].n).join(" · ")}</p>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn sm" onclick="A.add('${p.id}',50)">افزودن ۵۰ میلی‌لیتر</button><button class="btn ghost sm" onclick="A.cmp('${p.id}')">${S.compare.includes(p.id)?"در مقایسه":"مقایسه"}</button></div></div>
    <div class="score">${active?`<b>${faNum(x.pct)}٪</b><small>همخوانی</small>`:`<b style="font-size:28px">★ ${faNum(p.rating)}</b><small>${faNum(p.reviews)} نظر</small>`}</div>
  </article>`}).join("");
  if(active && !r.noExact) html+=`<div class="panel" style="margin-top:28px;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap"><p style="font-family:var(--display);font-size:24px">نزدیک است، اما نه دقیقاً؟</p><button class="btn ghost sm" onclick="A.briefFrom(${JSON.stringify(d.q).replace(/"/g,"&quot;")})">برایتان می‌سازیمش</button></div>`;
  return html;
}
function noMatchBlock(q,r){
  return `<div class="nomatch"><div><p class="eyebrow">مورد دقیقی پیدا نشد</p><h3 style="margin:10px 0 12px">رایحه‌ای که تصور می‌کنید را دقیقاً پیدا نکردیم. <em class="it">می‌توانیم آن را برایتان بسازیم.</em></h3>
  <p class="muted">${r.wanted.length>1?`هیچ‌کدام از عطرهای ما ${faList(r.wanted.map(n=>NOTES[n].n))} را با هم ندارند. یک عطرساز می‌تواند.`:"بریف شما مستقیم به دست عطرساز ما می‌رسد و او فرمولی برای تأیید شما می‌فرستد."}</p></div>

function quizCompute(){
  const score={}; const f={fam:[],mood:[],occ:[],season:[],notes:[],intensity:null};
  S.quiz.answers.forEach((k,i)=>{ const o=QUIZ[i].opts[k]; Object.entries(o.a).forEach(([a,v])=>score[a]=(score[a]||0)+v);
    if(o.f.mood) f.mood.push(o.f.mood); if(o.f.occ) f.occ.push(o.f.occ); if(o.f.season) f.season.push(o.f.season); if(o.f.intensity!=null) f.intensity=o.f.intensity; if(o.f.fam) f.fam.push(o.f.fam); if(o.f.note) f.notes.push(o.f.note); });
  const key=Object.entries(score).sort((a,b)=>b[1]-a[1])[0][0]; const A_=ARCHETYPES[key];
  const r=Engine.search("",{fam:[A_.fam,...new Set(f.fam)].slice(0,2),mood:[...new Set([...A_.moods,...f.mood])].slice(0,3),season:[...new Set(f.season)],occ:[...new Set(f.occ)],intensity:f.intensity});
  return {key,arch:A_,recs:r.results.slice(0,4),features:[Engine.F("fam",A_.fam,1.2),...A_.notes.slice(0,3).map(n=>Engine.F("note",n,.8)),...A_.moods.map(m=>Engine.F("mood",m,.8))]};
}

        <div class="field full"><label for="rv-photo">عکس (اختیاری)</label><input id="rv-photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp"></div>
        <div class="full"><button class="btn">ثبت نظر</button></div>
      </form></details>

  <section class="sec" aria-labelledby="sim-h"><div class="sec-head"><div><p class="eyebrow">رایحه‌های مشابه</p><h2 id="sim-h">اگر این را دوست دارید، <em>این‌ها را هم ببینید.</em></h2></div></div>
    <div class="row">${sim.map(x=>card(x.p,{why:`${faNum(Math.round(x.s*100))}٪ شباهت ساختاری`})).join("")}</div></section>
  ${house.length?`<section class="sec" aria-labelledby="hs-h"><div class="sec-head"><div><p class="eyebrow">دیگر عطرهای ${bname(p.brand)}</p><h2 id="hs-h">بقیه‌ی <em>این خانه.</em></h2></div><button class="link" onclick="go('b-${p.brand}')">داستان این خانه</button></div><div class="row">${house.map(x=>card(x)).join("")}</div></section>`:""}
  </div>`;
}

/* ===================== مقایسه ===================== */
function viewCompare(){
  const ps=S.compare.map(byId);
  if(ps.length<2) return `<div class="wrap empty" style="padding-block:96px"><h3>مقایسه‌ی رایحه‌ها</h3><p>با دکمه‌ی «مقایسه» دو تا چهار عطر انتخاب کنید تا اینجا کنار هم قرار بگیرند.</p><button class="btn" style="margin-top:20px" onclick="go('shop')">مرور عطرها</button></div>`;
  const shared=ps[0].notes.filter(n=>ps.every(p=>p.notes.includes(n)));
  const numRow=(label,idx,fmt=v=>faNum(v)+" از ۱۰")=>{const max=Math.max(...ps.map(p=>p.profile[idx]));return `<tr><th scope="row">${label}</th>${ps.map(p=>`<td class="${p.profile[idx]===max&&ps.some(q=>q.profile[idx]!==max)?"best":""}" style="--hue:${hueOf(p)}">${fmt(p.profile[idx])}<div class="cbar"><i style="width:${p.profile[idx]*10}%"></i></div></td>`).join("")}</tr>`;};
  const minP=Math.min(...ps.map(p=>p.variants[1].price));
  return `<div class="wrap" style="padding-block:40px 80px"><p class="eyebrow">مقایسه‌ی رایحه‌ها</p><h1 style="font-size:clamp(36px,5vw,68px);margin:12px 0 10px">کنار <em class="it">هم.</em></h1>
  <p class="muted" style="margin-bottom:28px">${shared.length?`هر ${faNum(ps.length)} عطر ${faList(shared.map(n=>NOTES[n].n))} را دارند. `:"این عطرها هیچ نت مشترکی ندارند. "}خانه‌های رنگی نشان می‌دهند کدام عطر متمایز است و نت‌های پررنگ مختص همان عطرند.</p>
  <div class="cmp"><table><thead><tr><th></th>${ps.map(p=>`<td style="--hue:${hueOf(p)}"><div style="width:110px;aspect-ratio:4/5;background:var(--sunk);margin-bottom:10px">${Art.bottle(p,{name:false})}</div><p class="eyebrow">${bname(p.brand)}</p><button style="font-family:var(--display);font-size:22px;text-align:start" onclick="go('p-${p.id}')">${pname(p)}</button><br><button class="rm" style="margin:6px 0 0" onclick="A.cmp('${p.id}');render()">حذف</button></td>`).join("")}</tr></thead>
  <tbody>
   <tr><th scope="row">قیمت ۵۰ میل</th>${ps.map(p=>`<td class="${p.variants[1].price===minP?"best":""}" style="--hue:${hueOf(p)}"><span class="num">${money(p.variants[1].price)}</span></td>`).join("")}</tr>
   <tr><th scope="row">خانواده</th>${ps.map(p=>`<td style="--hue:${hueOf(p)}"><span class="fam">${FAMILIES[p.family].name}</span></td>`).join("")}</tr>
   <tr><th scope="row">نت‌های اصلی</th>${ps.map(p=>`<td>${p.notes.map(n=>shared.includes(n)?`<span class="muted">${NOTES[n].n}</span>`:`<b style="font-weight:600">${NOTES[n].n}</b>`).join("، ")}</td>`).join("")}</tr>
   ${numRow("ماندگاری",4,v=>hours(v))}${numRow("پخش بو",5,v=>trail(v))}${numRow("شیرینی",1)}${numRow("تازگی",0)}${numRow("شدت",3)}
   <tr><th scope="row">فصل</th>${ps.map(p=>`<td>${p.seasons.map(s=>SEASON_FA[s]).join("، ")}</td>`).join("")}</tr>
   <tr><th scope="row">مناسبت</th>${ps.map(p=>`<td>${p.occ.map(s=>OCC_FA[s]).join("، ")}</td>`).join("")}</tr>
   <tr><th scope="row"></th>${ps.map(p=>`<td><button class="btn sm" onclick="A.add('${p.id}',50)">افزودن ۵۰ میل</button></td>`).join("")}</tr>
  </tbody></table></div></div>`;
}

const ORGAN={top:["bergamot","lemon","mandarin","grapefruit","pear","apple","pink pepper","saffron","cardamom","blackcurrant","pomegranate","sea salt"],heart:["rose","jasmine","lavender","iris","orange blossom","tuberose","neroli","fig leaf","tea","violet","cinnamon","incense","coffee","praline","tobacco","magnolia"],base:["vanilla","oud","amber","musk","sandalwood","cedar","vetiver","patchouli","leather","tonka bean","ambergris","benzoin","moss","labdanum"]};
const CONC={EdT:{n:"ادو تویلت",pct:"۱۲٪",m:.85,d:"سبک، ۴ تا ۶ ساعت"},EdP:{n:"ادو پرفیوم",pct:"۱۸٪",m:1,d:"متعادل، ۶ تا ۱۰ ساعت"},Extrait:{n:"اکستریت",pct:"۲۵٪",m:1.3,d:"غنی، بیش از ۱۰ ساعت"}};
const SIZE_BASE={30:14500000,50:19500000,100:29000000};
function newAtelier(seed={}){ return {step:0,fam:null,top:[],heart:[],base:[],sweet:5,fresh:5,intensity:5,longevity:7,occ:[],size:50,conc:"EdP",name:"",label:"",gift:false,message:"",brief:"",...seed}; }
function atelierPrice(a){
  const prem=[...a.top,...a.heart,...a.base].reduce((s,n)=>s+(NOTES[n].prem||0)*1000,0);
  const lines=[["شیشه · "+faNum(a.size)+" میلی‌لیتر",SIZE_BASE[a.size]],[CONC[a.conc].n,Math.round(SIZE_BASE[a.size]*(CONC[a.conc].m-1)/100000)*100000],["مواد گران‌بها",Math.round(prem*a.size/50/100000)*100000],["برچسب شخصی",a.label?1200000:0],["بسته‌بندی هدیه",a.gift?1800000:0]].filter(l=>l[1]!==0||l[0].startsWith("شیشه"));
  return {lines,total:lines.reduce((s,l)=>s+l[1],0)};
}
function atelierBottle(a){ return {id:"custom-"+(a.name||"x"),name:a.name||"عطر شما",brand:"atrsan",family:a.fam||"musk",shape:1}; }

  let body="";
  if(a.step===0) body=`<h2 style="font-size:clamp(30px,3.6vw,48px);margin-bottom:8px">با یک <em class="it">خانواده</em> شروع کنید.</h2><p class="muted" style="margin-bottom:24px">این مسیر کلی را مشخص می‌کند. نت‌ها را در مرحله‌ی بعد انتخاب می‌کنید.</p>
   <div class="famgrid">${["floral","woody","citrus","oriental","gourmand","fresh","aquatic","leather","musk","amber","green","fruity"].map(f=>`<button style="--hue:${FAMILIES[f].hue}" aria-pressed="${a.fam===f}" onclick="A.at('fam','${f}')"><b>${FAMILIES[f].name}</b><span>${FAMILIES[f].line}</span></button>`).join("")}</div>
   <div class="panel" style="margin-top:32px"><p class="eyebrow">یا با کلمات خودتان توصیفش کنید</p><form onsubmit="event.preventDefault();A.briefOnly(this.brief.value)"><label for="brief" class="sr">رایحه‌تان را توصیف کنید</label><textarea class="input" id="brief" name="brief" style="margin:12px 0;font-family:var(--display);font-size:20px;line-height:1.8" placeholder="برایم چیزی گرم، شیرین و مجلل با وانیل و عود بسازید، ولی نه خیلی تند.">${esc(a.brief)}</textarea>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn sm">ارسال این توضیح برای عطرساز</button><button type="button" class="btn ghost sm" onclick="A.briefToNotes(document.getElementById('brief').value)">تبدیل به نت‌هایی که بتوانم ویرایش کنم</button></div></form></div>`;
  if(a.step===1) body=`<h2 style="font-size:clamp(30px,3.6vw,48px);margin-bottom:8px"><em class="it">نت‌هایتان</em> را انتخاب کنید.</h2><p class="muted" style="margin-bottom:28px">در هر لایه حداکثر سه نت. نت‌های قیمت‌دار مواد گران‌بها هستند.</p>
   <div class="organ">${["top","heart","base"].map(t=>`<div><div class="tierhead"><span class="flabel">${{top:"نت‌های آغازین · اولین برداشت",heart:"نت‌های میانی · شخصیت عطر",base:"نت‌های پایه · آنچه می‌ماند"}[t]}</span><span class="lab">${faNum(a[t].length)} از ۳</span></div>
   <div class="vials">${ORGAN[t].map(n=>`<button class="vial" style="--hue:${FAMILIES[NOTES[n].fam].hue}" aria-pressed="${a[t].includes(n)}" onclick="A.atNote('${t}','${n}')"><i></i>${NOTES[n].n}${NOTES[n].prem?`<small>+${faNum(NOTES[n].prem/1000)} میلیون</small>`:""}</button>`).join("")}</div></div>`).join("")}</div>`;
  if(a.step===2) body=`<h2 style="font-size:clamp(30px,3.6vw,48px);margin-bottom:24px">به آن <em class="it">شخصیت</em> بدهید.</h2>
   <div class="sliders">${[["sweet","شیرینی","خشک","شیرین"],["fresh","تازگی","گرم","تازه"],["intensity","شدت","زمزمه","حضور پررنگ"],["longevity","ماندگاری","چند ساعت","تمام روز"]].map(([k,l,lo,hi])=>`<div class="slider"><div class="top"><label for="at-${k}">${l}</label><span class="num">${faNum(a[k])} از ۱۰</span></div><input id="at-${k}" type="range" min="0" max="10" value="${a[k]}" oninput="A.at('${k}',+this.value,true);this.previousElementSibling.lastElementChild.textContent=faNum(this.value)+' از ۱۰'"><div class="ends"><span>${lo}</span><span>${hi}</span></div></div>`).join("")}</div>
   <p class="flabel" style="margin:34px 0 12px">کجا می‌زنیدش؟</p><div class="chips">${OCCASIONS.map(o=>`<button class="chip" aria-pressed="${a.occ.includes(o)}" onclick="A.atOcc('${o}')">${OCC_FA[o]}</button>`).join("")}</div>`;
  if(a.step===3) body=`<h2 style="font-size:clamp(30px,3.6vw,48px);margin-bottom:24px">شیشه و <em class="it">غلظت.</em></h2>
   <p class="flabel" style="margin-bottom:10px">حجم</p><div class="opts">${[30,50,100].map(s=>`<button aria-pressed="${a.size===s}" onclick="A.at('size',${s})"><b>${faNum(s)} میلی‌لیتر</b><small>از ${money(SIZE_BASE[s])}</small></button>`).join("")}</div>
   <p class="flabel" style="margin:28px 0 10px">غلظت</p><div class="opts">${Object.entries(CONC).map(([k,c])=>`<button aria-pressed="${a.conc===k}" onclick="A.at('conc','${k}')"><b>${c.n}</b><small>${c.pct} · ${c.d}</small></button>`).join("")}</div>`;
  if(a.step===4) body=`<h2 style="font-size:clamp(30px,3.6vw,48px);margin-bottom:24px">جزئیات <em class="it">پایانی.</em></h2>
   <div class="formgrid"><div class="field"><label for="at-name">نام عطرتان</label><input class="input" id="at-name" maxlength="28" value="${esc(a.name)}" placeholder="مثلاً: زمستان تهران" oninput="A.at('name',this.value,true)"></div>
   <div class="field"><label for="at-label">برچسب شخصی (${money(1200000)})</label><input class="input" id="at-label" maxlength="32" value="${esc(a.label)}" placeholder="حروف اول نام، یک تاریخ، یک جمله" oninput="A.at('label',this.value,true)"></div>
   <label class="ship-opt full"><span><b style="font-weight:600">بسته‌بندی هدیه</b><br><span class="muted" style="font-size:13px">جعبه‌ی کتان، مهر موم و کارت دست‌نویس · ${money(1800000)}</span></span><input type="checkbox" ${a.gift?"checked":""} onchange="A.at('gift',this.checked)"></label>
   ${a.gift?`<div class="field full"><label for="at-msg">متن کارت</label><textarea class="input" id="at-msg" maxlength="240" oninput="A.at('message',this.value,true)">${esc(a.message)}</textarea></div>`:""}
   <div class="field full"><label for="at-brief">نکته‌ای برای عطرساز دارید؟</label><textarea class="input" id="at-brief" oninput="A.at('brief',this.value,true)" placeholder="یک خاطره، عطری که دوست دارید، چیزی که نباید باشد">${esc(a.brief)}</textarea></div></div>`;
  if(a.step===5){
    body=`<div class="reveal"><p class="eyebrow">آتلیه عطرسان · ${CONC[a.conc].n} ${CONC[a.conc].pct}</p><h2 style="font-size:clamp(40px,5.4vw,76px);line-height:1.25;margin:14px 0 18px">عطر شما <em class="it">آماده است.</em></h2>

     <div class="strata" style="--hue:${FAMILIES[a.fam||"musk"].hue}">${a.top.length?stratum("آغاز",a.top,.32,"شروع"):""}${a.heart.length?stratum("میانه",a.heart,.2,"شخصیت"):""}${a.base.length?stratum("پایه",a.base,.1,"آنچه می‌ماند"):""}</div>
     <div style="margin:28px 0;--hue:${FAMILIES[a.fam||"musk"].hue}">${profileBars([a.fresh,a.sweet,10-a.fresh,a.intensity,a.longevity])}</div>
     <p class="muted" style="margin-bottom:22px;max-width:56ch">عطرساز ما همه‌ی سفارش‌های اختصاصی را بررسی می‌کند و ممکن است برای تعادل، تغییرات کوچکی پیشنهاد دهد. پیش از هر پرداختی فرمول نهایی را تأیید می‌کنید و فرمول برای شارژ مجدد در حسابتان ذخیره می‌شود.</p>
     <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn accent" onclick="A.requestCustom()">ثبت درخواست عطر اختصاصی</button><button class="btn ghost" onclick="A.customToCart()">افزودن عطر اختصاصی به سبد</button></div></div>`;}
  const canNext=[!!a.fam,a.top.length+a.heart.length+a.base.length>=3,true,true,true,false][a.step];
  return `<div class="wrap atelier"><div style="min-width:0">

    <nav class="steps" style="margin-top:14px" aria-label="مراحل">${steps.map((s,i)=>`<button aria-current="${i===a.step?"step":"false"}" class="${i<a.step?"done":""}" onclick="A.atStep(${i})">${faNum(i+1)}. ${s}</button>`).join("")}</nav>

  </div>
  <aside class="summary" aria-label="عطر شما تا اینجا" style="--hue:${FAMILIES[a.fam||"musk"].hue}">

/* ===================== فروشگاه ===================== */
const CATS=[["all","همه‌ی عطرها"],["F","زنانه"],["M","مردانه"],["U","یونیسکس"],["niche","نیش"],["luxury","لوکس"],["everyday","روزمره"],["bestseller","پرفروش‌ها"],["new","تازه‌ها"],["custom","عطر اختصاصی"]];
function viewShop(){
  if(S.shopCat==="custom"){ S.shopCat="all"; setTimeout(()=>go("atelier")); return ""; }
  let ps=PRODUCTS.filter(p=>p.published);
  const c=S.shopCat; if(["F","M","U"].includes(c)) ps=ps.filter(p=>p.gender===c||(c!=="U"&&p.gender==="U")); else if(c!=="all") ps=ps.filter(p=>p.tags.includes(c));
  if(S.shopFam) ps=ps.filter(p=>p.family===S.shopFam);
  const sorts={recommended:(a,b)=>(b.rating*b.sold)-(a.rating*a.sold),newest:(a,b)=>b.added.localeCompare(a.added),"price-asc":(a,b)=>a.price-b.price,"price-desc":(a,b)=>b.price-a.price,rated:(a,b)=>b.rating-a.rating,selling:(a,b)=>b.sold-a.sold,longevity:(a,b)=>b.profile[4]-a.profile[4],popular:(a,b)=>b.reviews-a.reviews};
  ps=[...ps].sort(sorts[S.shopSort]);
  return `<div class="wrap" style="padding-block:40px 80px">
   <p class="eyebrow">مجموعه${S.shopFam?` · ${FAMILIES[S.shopFam].name} <button class="rm" onclick="S.shopFam=null;render()">حذف فیلتر</button>`:""}</p>
   <h1 style="font-size:clamp(40px,6.4vw,96px);line-height:1.2;margin:14px 0 30px">همه‌ی <em class="it">عطرها.</em></h1>
   <div class="toolbar"><nav class="chips" aria-label="دسته‌ها">${CATS.map(([k,l])=>`<button class="chip" aria-pressed="${S.shopCat===k}" onclick="S.shopCat='${k}';render()">${l}</button>`).join("")}</nav>

/* ===================== سبد خرید ===================== */
const SHIP={standard:{n:"پست پیشتاز · ۲ تا ۴ روز",c:150000},express:{n:"پیک فوری · تهران، روز بعد",c:250000},courier:{n:"ارسال همان روز · تهران",c:350000}};
function cartTotals(){
  const sub=S.cart.reduce((s,x)=>s+x.price*x.qty,0);
  const extras=(S.extras.discovery?2800000:0)+(S.extras.travel?2400000:0)+(S.gift.wrap?1200000:0);
  const c=S.coupon&&COUPONS[S.coupon];
  const disc=c&&c.type==="pct"?Math.round(sub*c.v/100):0;
  const freeStd=(c&&c.type==="ship")||sub+extras-disc>=15000000||!S.cart.length;
  const ship=S.ship==="express"?SHIP.express.c:S.ship==="courier"?SHIP.courier.c:freeStd?0:SHIP.standard.c;
  return {sub,extras,disc,ship,total:sub+extras-disc+ship};
}

  `<div class="ritual"><p class="flabel" style="margin-bottom:6px">آیین عطرتان را کامل کنید</p>
   <label class="opt"><span>ست کشف · شش ویال ۲ میلی‌لیتری ${fam}<br><span class="lab">پیش از شیشه‌ی بعدی امتحان کنید</span></span><span class="lab">+${money(2800000)} <input type="checkbox" ${S.extras.discovery?"checked":""} onchange="S.extras.discovery=this.checked;drawCart()" aria-label="افزودن ست کشف"></span></label>

   ${S.gift.wrap?`<textarea class="input" aria-label="متن کارت هدیه" placeholder="متن کارت هدیه" style="margin-top:8px;min-height:64px" oninput="S.gift.msg=this.value">${esc(S.gift.msg)}</textarea>`:""}</div>

   case "formulas": body=`<h2 style="font-size:44px;margin-bottom:24px">فرمول‌های ذخیره‌شده</h2>${myReqs.filter(r=>r.formulas.length).map(r=>{const f=r.formulas.find(x=>x.final)||r.formulas[r.formulas.length-1];return `<div class="panel" style="margin-bottom:12px;--hue:${FAMILIES[r.fam].hue}"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><b style="font-family:var(--display);font-size:24px;font-weight:400">${esc(r.name||r.id)}</b><span class="lab"><span class="ltr">${r.id}</span> · نسخه‌ی ${faNum(f.v)} · ${CONC[f.conc].n}</span></div><div class="strata" style="margin-top:14px">${stratum("آغاز",f.top,.3,"")}${stratum("میانه",[...new Set(f.heart)],.2,"")}${stratum("پایه",f.base,.1,"")}</div><button class="btn ghost sm" style="margin-top:14px" onclick="A.toast('درخواست شارژ مجدد ${esc(r.name||r.id)} ثبت شد')">درخواست شارژ مجدد</button></div>`}).join("")||`<p class="muted">فرمول‌ها پس از اینکه عطرساز برایتان بسازد اینجا نمایش داده می‌شوند.</p>`}`; break;
   case "reviews": { const mine=Object.entries(REVIEWS).flatMap(([pid,rs])=>rs.filter(r=>r.mine).map(r=>({...r,pid}))); body=`<h2 style="font-size:44px;margin-bottom:24px">نظرهای من</h2>${mine.length?mine.map(r=>`<div class="review"><div class="who"><b>${pname(byId(r.pid))}</b><p class="stars">${"★".repeat(r.rating)}</p></div><div><p class="q">«${esc(r.text)}»</p><p class="lab" style="margin-top:8px">${r.status==="pending"?"در انتظار بررسی":"منتشرشده"}</p></div></div>`).join(""):`<p class="muted">نظرهایی که می‌نویسید اینجا نمایش داده می‌شوند.</p>`}`; break; }
   case "addresses": body=`<h2 style="font-size:44px;margin-bottom:24px">نشانی‌ها</h2><div class="panel" style="max-width:460px"><p class="eyebrow">پیش‌فرض</p><p style="margin-top:8px">${esc(me.name)}<br>تهران، خیابان ولیعصر، بالاتر از پارک ساعی<br>کوچه‌ی نسترن، پلاک ۱۲، واحد ۵<br>کد پستی ۱۵۹۹۸۳۴۵۶۷</p></div>`; break;
   case "notifications": body=`<h2 style="font-size:44px;margin-bottom:24px">اعلان‌ها</h2>${S.notifications.map(n=>`<div class="review" style="grid-template-columns:160px 1fr"><span class="lab">${fmtDate(n.d)}</span><p>${esc(n.t)}</p></div>`).join("")}`; break;
  }
  S.notifications.forEach(n=>{if(S.acctTab==="notifications")n.read=true;});

function statusPill(s){ const cls={Delivered:"good",Completed:"good",Paid:"info",Shipped:"info",Processing:"warn",Packed:"warn",Pending:"",Reviewing:"warn","Formula Created":"info","Awaiting Customer Approval":"bad","In Production":"warn","Quality Check":"warn",Cancelled:"bad",Refunded:"bad"}[s]||""; return `<span class="pill ${cls}">${ORDER_FA[s]||CUSTOM_FA[s]||s}</span>`; }
function customCard(r){
  const idx=CUSTOM_STATUSES.indexOf(r.status); const f=r.formulas.find(x=>x.final)||r.formulas[r.formulas.length-1];
  return `<div class="panel" style="margin-bottom:16px;--hue:${FAMILIES[r.fam].hue}"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><p class="eyebrow"><span class="ltr">${r.id}</span> · ثبت در ${fmtDate(r.date)}</p><h3 style="font-size:28px;margin-top:6px">${esc(r.name||"عطر بی‌نام")}</h3></div>${statusPill(r.status)}</div>
  <div class="timeline" aria-label="مراحل">${CUSTOM_STATUSES.map((s,i)=>`<div class="${i<idx?"done":i===idx?"now":""}">${CUSTOM_FA[s]}</div>`).join("")}</div>
  <p class="why">«${esc(r.brief)}»</p>
  ${r.status==="Awaiting Customer Approval"&&f?`<div style="margin-top:18px;border-top:1px solid var(--line);padding-top:18px"><p class="flabel">فرمول عطرساز شما · نسخه‌ی ${faNum(f.v)}</p><div class="strata" style="margin:12px 0">${stratum("آغاز",f.top,.3,"")}${stratum("میانه",f.heart,.2,"")}${stratum("پایه",f.base,.1,"")}</div><p class="muted" style="font-size:14px">${esc(f.notes)}</p>
   <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center"><button class="btn accent" onclick="A.approveFormula('${r.id}')">تأیید و پرداخت ${money(r.price)}</button><button class="btn ghost" onclick="A.requestChanges('${r.id}')">درخواست تغییر</button></div></div>`:""}
  </div>`;
}
function viewNotFound(){ return `<div class="wrap empty" style="padding-block:120px"><h3>این صفحه مثل یک نت آغازین پرید.</h3><p>بیایید چیزی ماندگارتر پیدا کنیم.</p><button class="btn" style="margin-top:20px" onclick="go('discover')">عطرتان را پیدا کنید</button></div>`; }
/* ===================== پنل مدیریت (استودیو) ===================== */
const ADMIN_NAV=[["dashboard","داشبورد"],["products","محصولات"],["brands","برندها"],["orders","سفارش‌ها"],["customers","مشتریان"],["custom","عطرهای اختصاصی"],["inventory","انبار"],["reviews","نظرها"],["discounts","تخفیف‌ها"],["analytics","گزارش‌ها"],["content","محتوا"],["notes","نت‌های عطر"],["settings","تنظیمات و نقش‌ها"]];
const custName=id=>CUSTOMERS.find(c=>c.id===id)?.name||"مهمان";
const variantsAll=()=>PRODUCTS.flatMap(p=>p.variants.map(v=>({p,v,avail:v.stock-v.reserved})));
const lowStock=()=>variantsAll().filter(x=>x.avail<=x.v.threshold);
const liveOrders=()=>ORDERS.filter(o=>!["Cancelled","Refunded"].includes(o.status));
const SEG_FA={New:"جدید",VIP:"ویژه",Returning:"وفادار","High value":"خرید بالا","Custom perfume":"عطر اختصاصی",Inactive:"غیرفعال"};
function custStats(c){ const os=ORDERS.filter(o=>o.cust===c.id&&!["Cancelled","Refunded"].includes(o.status)); const spent=os.reduce((s,o)=>s+o.total,0); const last=os[0]?.date; const reqs=CUSTOM_REQS.filter(r=>r.cust===c.id);
  const seg=[]; if((TODAY-new Date(c.joined))/864e5<=30) seg.push("New"); if(spent>=60000000) seg.push("VIP"); if(os.length>=2) seg.push("Returning"); if(os.length&&spent/os.length>=25000000) seg.push("High value"); if(reqs.length) seg.push("Custom perfume"); if(!last||(TODAY-new Date(last))/864e5>60) seg.push("Inactive");
  return {orders:os.length,spent,last,reqs,seg}; }

function viewAdmin(){
  const allowed=ROLES[S.role]; if(!allowed.includes(S.adminTab)) S.adminTab="dashboard";
  const counts={orders:ORDERS.filter(o=>["Pending","Paid","Processing"].includes(o.status)).length,custom:CUSTOM_REQS.filter(r=>["Pending","Reviewing"].includes(r.status)).length,inventory:lowStock().length,reviews:Object.values(REVIEWS).flat().filter(r=>r.status==="pending").length};
  const views={dashboard:adDash,products:adProducts,brands:adBrands,orders:adOrders,customers:adCustomers,custom:adCustom,inventory:adInventory,reviews:adReviews,discounts:adDiscounts,analytics:adAnalytics,content:adContent,notes:adNotes,settings:adSettings};
  return `<div class="admin"><aside aria-label="منوی مدیریت"><p class="eyebrow" style="padding:4px 12px 14px">استودیوی عطرسان</p>
  ${ADMIN_NAV.filter(([k])=>allowed.includes(k)).map(([k,l])=>`<button aria-current="${S.adminTab===k?"page":"false"}" onclick="S.adminTab='${k}';render()"><span>${l}</span>${counts[k]?`<span class="cnt">${faNum(counts[k])}</span>`:""}</button>`).join("")}
  <div class="rolebar"><label for="role" class="flabel">نمایش با نقش</label><select id="role" class="input" style="height:38px" onchange="S.role=this.value;render()">${Object.keys(ROLES).map(r=>`<option ${S.role===r?"selected":""}>${r}</option>`).join("")}</select><button class="link" style="align-self:flex-start;margin-top:8px" onclick="go('home')">بازگشت به فروشگاه ←</button></div></aside>
  <main class="pagefade">${views[S.adminTab]()}</main></div>`;

function adHead(t,sub,action=""){ return `<div class="head"><div><h2>${t}</h2>${sub?`<p class="muted">${sub}</p>`:""}</div>${action}</div>`; }
function revenueSeries(days=30){
  const out=[]; let r=11;
  for(let i=days-1;i>=0;i--){ const d=daysAgo(i); const key=d.toISOString().slice(0,10); r=(r*9301+49297)%233280;
    const base=160000000+Math.sin(i/3)*38000000+(r/233280)*90000000+(d.getDay()===4||d.getDay()===5?70000000:0);
    const real=liveOrders().filter(o=>o.date.slice(0,10)===key).reduce((s,o)=>s+o.total,0);
    out.push({d,key,v:Math.round(base+real)}); }
  return out;
}
const mt=v=>faNum(Math.round(v/1e6))+" م";
function revenueChart(series){
  const W=720,H=220,P={l:12,r:56,t:14,b:26}, max=Math.ceil(Math.max(...series.map(s=>s.v))/1e8)*1e8;
  // محور زمان راست‌به‌چپ: امروز سمت چپ
  const x=i=>W-P.r-i*(W-P.l-P.r)/(series.length-1), y=v=>P.t+(H-P.t-P.b)*(1-v/max);
  const line=series.map((s,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(s.v).toFixed(1)}`).join(" ");
  const ticks=[0,max/2,max].map(v=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${W-P.r+6}" y="${y(v)+3}" text-anchor="start">${mt(v)}</text>`).join("");
  const xl=series.map((s,i)=>(i%7===0&&i<series.length-4)||i===series.length-1?`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${s.d.toLocaleDateString("fa-IR",{month:"short",day:"numeric"})}</text>`:"").join("");
  const last=series[series.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="فروش روزانه در ۳۰ روز گذشته" style="width:100%;height:auto">${ticks}<path d="${line} L${x(series.length-1)} ${y(0)} L${x(0)} ${y(0)} Z" style="fill:var(--accent)" opacity=".1"/><path d="${line}" style="stroke:var(--accent);fill:none" stroke-width="1.8"/><circle cx="${x(series.length-1)}" cy="${y(last.v)}" r="4" style="fill:var(--accent)"/><text x="${x(series.length-1)+8}" y="${y(last.v)-10}" text-anchor="start" style="fill:var(--ink)">${mt(last.v)} تومان</text>${xl}</svg>`;
}
function adDash(){
  const s=revenueSeries(30), total=s.reduce((a,b)=>a+b.v,0), prev=Math.round(total*.88), today=s[s.length-1].v;
  const orders=liveOrders(); const aov=orders.reduce((a,o)=>a+o.total,0)/Math.max(1,orders.length);
  const top=[...PRODUCTS].sort((a,b)=>b.sold-a.sold).slice(0,5);
  const newC=CUSTOMERS.filter(c=>(TODAY-new Date(c.joined))/864e5<=30).length;
  const pend=ORDERS.filter(o=>["Pending","Paid","Processing","Packed"].includes(o.status));
  return adHead("عصر بخیر",`چهارشنبه ${TODAY.toLocaleDateString("fa-IR",{day:"numeric",month:"long",year:"numeric"})} · آمار ۳۰ روز گذشته`)+
  `<div class="kpis">
   <div class="kpi"><span class="eyebrow">فروش کل · ۳۰ روز</span><b>${mt(total)}</b><span class="d up">▲ ${faNum(Math.round((total/prev-1)*100))}٪ نسبت به ۳۰ روز قبل · میلیون تومان</span></div>
   <div class="kpi"><span class="eyebrow">امروز</span><b>${mt(today)}</b><span class="d muted">${faNum(orders.filter(o=>o.date.slice(0,10)==="2026-10-07").length)} سفارش تا این لحظه</span></div>
   <div class="kpi"><span class="eyebrow">سفارش‌های در جریان</span><b>${faNum(pend.length)}</b><span class="d ${pend.length>5?"down":"muted"}">${faNum(ORDERS.filter(o=>o.status==="Pending").length)} در انتظار پرداخت</span></div>
   <div class="kpi"><span class="eyebrow">موجودی کم</span><b>${faNum(lowStock().length)}</b><span class="d down">کالا در حد هشدار یا کمتر</span></div>
   <div class="kpi"><span class="eyebrow">درخواست‌های اختصاصی</span><b>${faNum(CUSTOM_REQS.filter(r=>r.status!=="Completed").length)}</b><span class="d muted">${faNum(CUSTOM_REQS.filter(r=>r.status==="Pending").length)} مورد جدید</span></div>
   <div class="kpi"><span class="eyebrow">مشتریان جدید</span><b>${faNum(newC)}</b><span class="d up">▲ ۲ در این هفته</span></div>
   <div class="kpi"><span class="eyebrow">نرخ تبدیل</span><b>۳٫۴٪</b><span class="d up">▲ ۰٫۳ واحد</span></div>
   <div class="kpi"><span class="eyebrow">میانگین هر سفارش</span><b>${mt(aov)}</b><span class="d muted">از ${faNum(orders.length)} سفارش · میلیون تومان</span></div>
  </div>
  <div class="grid2"><div class="panel"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><span class="flabel">فروش روزانه</span><span class="lab">میلیون تومان</span></div>${revenueChart(s)}</div>
  <div class="panel"><span class="flabel">پرفروش‌ترین عطرها · تعداد</span><div style="margin-top:12px">${top.map(p=>`<div class="hbar" style="--hue:${hueOf(p)}"><span>${pname(p)}</span><span class="t"><i style="width:${p.sold/top[0].sold*100}%"></i></span><span>${faNum(p.sold)}</span></div>`).join("")}</div></div></div>

function seedAtelierFromText(text,a){
  const r=Engine.parse(text||""); const notes=[...new Set([...r.notesWanted,...r.features.filter(f=>f.type==="note").map(f=>f.key)])];
  notes.forEach(n=>{ const t=NOTES[n].tier; if(a[t].length<3&&!a[t].includes(n)&&ORGAN[t].includes(n)) a[t].push(n); });
  const fam=r.features.find(f=>f.type==="fam"&&f.sign>0)?.key || (notes[0]&&NOTES[notes[notes.length-1]].fam) || a.fam;
  a.fam=fam||"amber";
  r.features.filter(f=>f.type==="prof").forEach(f=>{ const k={0:"fresh",1:"sweet",3:"intensity",4:"longevity"}[f.key]; if(k) a[k]=f.sign>0?8:3; });
  r.features.filter(f=>f.type==="occ"&&f.sign>0).forEach(f=>{ if(!a.occ.includes(f.key)) a.occ.push(f.key); });
  a.brief=text; return a;
}

/* ===================== مسیریابی و قاب صفحه ===================== */
const TITLES={home:"عطرسان · هنر رایحه",discover:"عطرتان را پیدا کنید · عطرسان",quiz:"شخصیت رایحه‌ای شما · عطرسان",shop:"همه‌ی عطرها · عطرسان",compare:"مقایسه‌ی رایحه‌ها · عطرسان",atelier:"ساخت عطر اختصاصی · آتلیه عطرسان",brands:"خانه‌های عطر · عطرسان",library:"کتابخانه‌ی رایحه · عطرسان",stories:"داستان‌های رایحه · عطرسان",checkout:"تکمیل خرید · عطرسان",confirm:"سفارش ثبت شد · عطرسان",account:"حساب کاربری · عطرسان",admin:"پنل مدیریت · عطرسان"};
function currentView(){
  const r=S.route, a=S.arg;
  switch(r){ case "home":return viewHome(); case "discover":return viewDiscover(); case "quiz":return viewQuiz(); case "shop":return viewShop(); case "compare":return viewCompare(); case "atelier":return viewAtelier(); case "brands":return viewBrands(); case "library":return viewLibrary(); case "stories":return viewStories(); case "checkout":return viewCheckout(); case "confirm":return viewConfirm(); case "account":return viewAccount(); case "admin":return viewAdmin();
    case "product":return viewProduct(a); case "brand":return viewBrand(a); case "note":return viewNote(noteFromSlug(a)); case "story":return viewStory(a); }
  return viewNotFound();
}
function parseToken(tok){
  if(!tok) return ["home",null];
  const m=tok.match(/^(p|b|n|s)-(.+)$/); if(m) return [{p:"product",b:"brand",n:"note",s:"story"}[m[1]],m[2]];
  return [TITLES[tok]?tok:"home",null];
}
function go(tok,anchor){
  const [r,a]=parseToken(tok); S.route=r; S.arg=a;
  try{ if(location.hash.slice(1)!==tok) history.pushState(null,"","#"+tok); }catch(e){}
  render();
  if(anchor){ setTimeout(()=>document.getElementById(anchor)?.scrollIntoView({behavior:"smooth"}),60); } else window.scrollTo(0,0);
  document.getElementById("app").focus({preventScroll:true});
}
window.addEventListener("popstate",()=>{ const [r,a]=parseToken(location.hash.slice(1)); S.route=r; S.arg=a; render(); });
function render(){
  const ae=document.activeElement, aid=ae&&ae.id, sel=aid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
  document.getElementById("app").innerHTML=`<div class="${S.route==="admin"?"":"pagefade"}">${currentView()}</div>`;
  if(!["product","brand","note","story"].includes(S.route)) document.title=TITLES[S.route]||"عطرسان";
  shell();
  document.getElementById("foot").hidden=S.route==="admin"; document.getElementById("whisper").hidden=["admin","checkout","atelier"].includes(S.route);
  if(aid){ const el=document.getElementById(aid); if(el&&el!==document.body){ el.focus({preventScroll:true}); if(sel&&el.setSelectionRange) try{el.setSelectionRange(...sel);}catch(e){} } }
  if(S.route==="home") smoke();
}
function shell(){
  const nav={discover:"discover",shop:"shop",product:"shop",brands:"brands",brand:"brands",library:"library",note:"library",stories:"stories",story:"stories",quiz:"quiz",atelier:"atelier",account:"account",admin:"admin"}[S.route];
  document.querySelectorAll("[data-nav]").forEach(b=>b.setAttribute("aria-current",b.dataset.nav===nav?"page":"false"));
  const n=S.cart.reduce((s,x)=>s+x.qty,0); document.querySelectorAll(".bagcount").forEach(b=>b.textContent=n?faNum(n):"");
  document.getElementById("wishcount").textContent=S.wish.size?faNum(S.wish.size):"";
  const dock=document.getElementById("dock");
  dock.hidden=!S.compare.length||S.route==="compare"||S.route==="admin";
  dock.innerHTML=`<span>${faNum(S.compare.length)} عطر برای مقایسه</span>${S.compare.length>=2?`<button class="btn sm" onclick="go('compare')">مقایسه</button>`:`<span class="lab" style="color:inherit;opacity:.7">یکی دیگر اضافه کنید</span>`}<button aria-label="پاک کردن مقایسه" class="ico" onclick="S.compare=[];shell();" style="width:30px;height:30px">${ICON.close.replace('<svg','<svg style="stroke:var(--bg)"')}</button>`;
}

/* ---------- دود رنگی صفحه‌ی اول ---------- */
function smoke(){
  const c=document.getElementById("smoke"); if(!c) return; const ctx=c.getContext("2d");
  const cs=getComputedStyle(document.documentElement); const cols=["--f-floral","--f-amber","--f-mysterious","--f-fresh","--f-woody"].map(v=>cs.getPropertyValue(v).trim()||"#a85");
  const toRGBA=(hex,a)=>{const h=hex.replace("#","");const n=parseInt(h.length===3?h.split("").map(x=>x+x).join(""):h,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;};
  const blobs=cols.map((col,i)=>({col,x:.05+((i*37)%40)/100,y:.2+((i*53)%70)/100,r:.28+((i*17)%20)/100,sx:.00011+i*.00003,sy:.00009+i*.00002,ph:i*1.7}));
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w,h,last=0,visible=true;
  const size=()=>{const d=Math.min(2,devicePixelRatio||1);w=c.clientWidth;h=c.clientHeight;c.width=w*d;c.height=h*d;ctx.setTransform(d,0,0,d,0,0);};
  size(); window.addEventListener("resize",size,{passive:true});
  new IntersectionObserver(e=>visible=e[0].isIntersecting).observe(c);
  const draw=t=>{ ctx.clearRect(0,0,w,h);
    blobs.forEach(b=>{const x=(b.x+Math.sin(t*b.sx+b.ph)*.12)*w, y=(b.y+Math.cos(t*b.sy+b.ph)*.1)*h, r=b.r*Math.max(w,h)*(1+Math.sin(t*.0002+b.ph)*.08);
      const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,toRGBA(b.col,.22)); g.addColorStop(.6,toRGBA(b.col,.06)); g.addColorStop(1,toRGBA(b.col,0)); ctx.fillStyle=g; ctx.fillRect(0,0,w,h);}); };
  if(reduce){ draw(9000); return; }
  const loop=t=>{ if(!c.isConnected) return; if(visible&&t-last>40){draw(t);last=t;} requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  const stage=document.querySelector(".hero .stage .art");
  if(stage&&matchMedia("(pointer:fine)").matches) c.parentElement.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect();const dx=(e.clientX-r.left)/r.width-.5, dy=(e.clientY-r.top)/r.height-.5; stage.parentElement.style.transform=`translate(${dx*-14}px,${dy*-10}px)`;},{passive:true});
}

/* ---------- شروع ---------- */
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if(document.getElementById("modal-root").innerHTML) A.closeModal(); else A.closeCart(); document.getElementById("filters")?.classList.remove("open"); } });
(function boot(){ const [r,a]=parseToken(location.hash.slice(1)); S.route=r; S.arg=a; render(); })();
</script>
